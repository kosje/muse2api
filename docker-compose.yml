{
  "services": {
    "api": {
      "build": ".",
      "image": "muse2api-secure:local",
      "user": "10001:10001",
      "restart": "unless-stopped",
      "init": true,
      "read_only": true,
      "cap_drop": ["ALL"],
      "security_opt": ["no-new-privileges:true"],
      "ports": ["127.0.0.1:18610:18610"],
      "volumes": ["muse_data:/app/data"],
      "tmpfs": ["/tmp:rw,nosuid,nodev,size=512m,mode=1777"],
      "shm_size": "1g",
      "mem_limit": "3g",
      "pids_limit": 512,
      "logging": {"driver": "json-file", "options": {"max-size": "10m", "max-file": "3"}}
    }
  },
  "volumes": {"muse_data": {}}
}
