<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Muse 管理</title>
<style>body{font:16px system-ui;max-width:960px;margin:32px auto;padding:0 20px;background:#f7f7f5;color:#23231f}section{padding:20px;background:white;border:1px solid #ddd;border-radius:12px;margin:20px 0}input,textarea,button{font:inherit;padding:10px;box-sizing:border-box;margin:5px 0}input,textarea{width:100%}button{cursor:pointer;margin-right:8px}td,th{padding:10px;text-align:left;border-bottom:1px solid #ddd}table{width:100%}video,img{max-width:100%;max-height:300px}article{border-top:1px solid #ddd;padding:15px 0}#message{white-space:pre-wrap}</style></head><body>
<h1>Muse 管理</h1><a href="/">视频工作台</a>
<section><label>管理员 Key<input id="key" type="password" autocomplete="off"></label><button id="connect">连接</button><button id="logout">退出</button><p>Key 只保存在当前标签页会话中。</p><p id="message" role="status"></p></section>
<section><h2>客户端接入</h2><p id="base"></p><label>生成接口 Key<input id="apiKey" type="password" readonly></label><button id="show">显示/隐藏</button><button id="rotate">更换生成接口 Key</button><button id="rotateAdmin">更换管理员 Key</button></section>
<section><h2>导入账号</h2><label>标签<input id="label" maxlength="100"></label><label>muse.ai Cookie<textarea id="cookies" rows="4" autocomplete="off" placeholder="hatch_sess=...; hatch_gw=...; hatch_vml=...; hatch_native_auth_device=...&#10;也支持：标签 | Cookie 字符串"></textarea></label><button id="add">导入</button><button id="helper">下载导号工具</button><p id="importMessage" role="status" aria-live="polite"></p><p>导号工具填写此站点地址和管理员 Key。仅使用 HTTPS 或本机 SSH 隧道。</p></section>
<section><h2>账号池</h2><button id="refresh">刷新</button><table><thead><tr><th>标签</th><th>状态</th><th>操作</th></tr></thead><tbody id="accounts"></tbody></table></section>
<section><h2>生成文件</h2><button id="media">加载</button><p id="mediaMessage" role="status" aria-live="polite"></p><div id="files"></div></section>
<script>
'use strict';
const $=id=>document.getElementById(id),storage='muse_admin_session';
let key=sessionStorage.getItem(storage)||'';$('key').value=key;$('base').textContent=location.origin+'/v1';
localStorage.removeItem('muse2api_key');if(location.search)history.replaceState(null,'',location.pathname);
const message=t=>{$('message').textContent=t;};
async function api(path,body,method){
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),/\/(?:test|quota|keepalive)$/.test(path)?180000:15000);
 try{
  const r=await fetch(path,{method:method||(body?'POST':'GET'),headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,signal:controller.signal});
  let data;try{data=await r.json();}catch(e){if(e.name==='AbortError')throw e;throw Error('服务器返回异常，请确认 SSH 隧道和页面地址。');}
  if(!r.ok){
   if(r.status===401||r.status===403)throw Error('管理员 Key 无效或尚未连接，请在页面顶部填写管理员 Key 并点击“连接”。');
   throw Error(typeof data.detail==='string'?data.detail:'请求失败（HTTP '+r.status+'）');
  }
  return data;
 }catch(e){if(e.name==='AbortError')throw Error('请求超时：请检查 SSH 隧道是否断线，恢复后刷新列表确认操作结果。');if(e instanceof TypeError)throw Error('连接中断：请检查 SSH 隧道后重试。');throw e;}finally{clearTimeout(timer);}
}
function action(id,fn){$(id).onclick=async()=>{try{await fn();}catch(e){message(e.message);}};}
async function session(){await api('/v1/media/session',{});}
async function refresh(){
 await session();$('apiKey').value=(await api('/admin/apikey')).api_key;
 const r=await api('/admin/accounts');$('accounts').replaceChildren();
 for(const a of r.accounts){const tr=document.createElement('tr');for(const v of [a.label,a.enabled?(a.ok===false?'需重新登录':'已启用'):'已停用']){const td=document.createElement('td');td.textContent=v;tr.append(td);}const td=document.createElement('td');
 for(const [label,fn] of [['检查会话',async()=>{message('正在检查…');message((await api('/admin/accounts/'+encodeURIComponent(a.id)+'/test',{})).message||'完成');}],['删除',async()=>{if(confirm('删除此账号？')){await api('/admin/accounts/'+encodeURIComponent(a.id),null,'DELETE');await refresh();}}]]){const b=document.createElement('button');b.textContent=label;b.onclick=()=>fn().catch(e=>message(e.message));td.append(b);}tr.append(td);$('accounts').append(tr);}
}
action('connect',async()=>{key=$('key').value.trim();await refresh();sessionStorage.setItem(storage,key);message('已连接');});
action('logout',async()=>{key='';sessionStorage.removeItem(storage);$('key').value='';$('apiKey').value='';$('accounts').replaceChildren();$('files').replaceChildren();await fetch('/v1/media/session',{method:'DELETE'});message('已退出');});
action('refresh',refresh);action('show',async()=>{$('apiKey').type=$('apiKey').type==='password'?'text':'password';});
action('rotate',async()=>{if(confirm('旧生成接口 Key 将立即失效，继续？')){$('apiKey').value=(await api('/admin/apikey/rotate',{})).api_key;message('已更换，请更新客户端配置。');}});
action('rotateAdmin',async()=>{if(confirm('旧管理员 Key 将立即失效，继续？')){key=(await api('/admin/adminkey/rotate',{})).admin_key;sessionStorage.setItem(storage,key);$('key').value=key;await session();message('管理员 Key 已更换。服务器端可运行 install.sh --credentials 查看。');}});
action('add',async()=>{
 const button=$('add'),status=$('importMessage');
 if(!key){status.textContent='请先在页面顶部填写管理员 Key 并点击“连接”。';return;}
 const raw=$('cookies').value.trim();if(!raw){status.textContent='请先粘贴 Cookie。';return;}
 button.disabled=true;button.textContent='正在导入…';status.textContent='正在提交账号，请稍候…';
 try{
  const result=await api('/admin/accounts',{label:$('label').value.trim(),cookie_header:raw});
  $('cookies').value='';status.textContent='导入成功：'+result.count+' 个账号。';
  try{await refresh();}catch(e){status.textContent+=' 账号池刷新失败，请点击“刷新”确认；无需重复导入。';}
 }catch(e){status.textContent=e.message;}finally{button.disabled=false;button.textContent='导入';}
});
action('helper',async()=>{const r=await fetch('/admin/cookie-helper?download=1',{headers:{Authorization:'Bearer '+key}});if(!r.ok)throw Error('下载失败');const u=URL.createObjectURL(await r.blob()),a=document.createElement('a');a.href=u;a.download='get_muse_cookie.py';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);});
let mediaItems=[];
function formatBytes(bytes){return bytes<1048576?(bytes/1024).toFixed(1)+' KB':(bytes/1048576).toFixed(1)+' MB';}
function mediaSummary(){return mediaItems.length?'共 '+mediaItems.length+' 个文件，占用 '+formatBytes(mediaItems.reduce((sum,m)=>sum+m.bytes,0))+'。':'还没有生成文件。';}
async function removeMedia(m,button){
 if(!confirm('确定从服务器永久删除这个'+(m.kind==='video'?'视频':'图片')+'？\n'+m.name+'（'+formatBytes(m.bytes)+'）\n删除后无法撤销；电脑上已下载的副本不受影响。'))return;
 const status=$('mediaMessage');button.disabled=true;button.textContent='正在删除…';status.textContent='正在删除 '+m.name+'…';
 try{
  const result=await api('/admin/media/'+encodeURIComponent(m.name),null,'DELETE');
  mediaItems=mediaItems.filter(item=>item.name!==m.name);renderMediaLists();
  status.textContent=(result.already_missing?'文件已不存在。':'已删除，移除 '+formatBytes(result.freed_bytes)+'。')+' '+mediaSummary();
 }catch(e){status.textContent=e.message;}finally{button.disabled=false;button.textContent='删除';}
}
function renderMediaLists(){
 $('files').replaceChildren();
 for(const [kind,label] of [['video','视频'],['image','图片']]){
  const items=mediaItems.filter(item=>item.kind===kind),group=document.createElement('div'),heading=document.createElement('h3');
  group.id=kind+'Files';heading.textContent=label+'（'+items.length+'）';group.append(heading);
  if(!items.length){const empty=document.createElement('p');empty.textContent='暂无'+label+'。';group.append(empty);}
  else{
   const scroll=document.createElement('div'),table=document.createElement('table'),head=document.createElement('thead'),hr=document.createElement('tr'),body=document.createElement('tbody');scroll.style.overflowX='auto';
   for(const title of ['文件名','大小','生成时间','操作']){const th=document.createElement('th');th.textContent=title;hr.append(th);}head.append(hr);table.append(head,body);
   for(const m of items){
    const u=new URL(m.url,location.origin);if(u.origin!==location.origin||!u.pathname.startsWith('/v1/media/'))continue;
    const row=document.createElement('tr');row.dataset.name=m.name;
    for(const text of [m.name,formatBytes(m.bytes),new Date(m.mtime*1000).toLocaleString()]){const td=document.createElement('td');td.textContent=text;row.append(td);}
    const actions=document.createElement('td'),a=document.createElement('a'),del=document.createElement('button');
    a.href=u.href;a.download=m.name;a.textContent='下载';a.style.marginRight='12px';
    del.type='button';del.className='delete-media';del.textContent='删除';del.style.color='#b42318';del.setAttribute('aria-label','删除 '+m.name);del.onclick=()=>removeMedia(m,del);
    actions.append(a,del);row.append(actions);body.append(row);
   }
   scroll.append(table);group.append(scroll);
  }
  $('files').append(group);
 }
}
action('media',async()=>{
 const button=$('media'),status=$('mediaMessage');button.disabled=true;button.textContent='正在加载…';status.textContent='正在获取文件列表…';
 try{await session();const r=await api('/admin/media');mediaItems=r.media;renderMediaLists();status.textContent=mediaSummary();}
 catch(e){status.textContent=e.message;}finally{button.disabled=false;button.textContent='加载';}
});
setInterval(()=>{if(key)session().catch(()=>{});},300000);if(key)refresh().catch(e=>message(e.message));
</script></body></html>
